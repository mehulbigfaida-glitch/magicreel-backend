name: Muse backend build validation

on:
  push:
    branches:
      - feature/muse-selected-identity-assets
  pull_request:
    branches:
      - main
    paths:
      - "prisma/**"
      - "src/magicreel/muse/**"
      - "src/magicreel/db/prisma.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/magicreel
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/magicreel
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: TypeScript build
        run: npm run build
